<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="brandMotif" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Chevron/Diamond geometric pattern inspired by Solitario brand -->
      <rect width="60" height="60" fill="#1a1714"/>
      
      <!-- Main chevron shapes -->
      <path d="M0 30 L15 15 L30 30 L15 45 Z" fill="none" stroke="#c39275" stroke-width="2"/>
      <path d="M5 30 L15 20 L25 30 L15 40 Z" fill="none" stroke="#c39275" stroke-width="1.5"/>
      <path d="M10 30 L15 25 L20 30 L15 35 Z" fill="none" stroke="#c39275" stroke-width="1"/>
      
      <path d="M30 0 L45 -15 L60 0 L45 15 Z" fill="none" stroke="#c39275" stroke-width="2"/>
      <path d="M35 0 L45 -10 L55 0 L45 10 Z" fill="none" stroke="#c39275" stroke-width="1.5"/>
      
      <path d="M30 60 L45 45 L60 60 L45 75 Z" fill="none" stroke="#c39275" stroke-width="2"/>
      <path d="M35 60 L45 50 L55 60 L45 70 Z" fill="none" stroke="#c39275" stroke-width="1.5"/>
      
      <!-- Connecting lines -->
      <line x1="15" y1="15" x2="45" y2="15" stroke="#c39275" stroke-width="1" opacity="0.6"/>
      <line x1="15" y1="45" x2="45" y2="45" stroke="#c39275" stroke-width="1" opacity="0.6"/>
      <line x1="30" y1="30" x2="60" y2="30" stroke="#c39275" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#brandMotif)"/>
</svg>
